seed: 42
backend: mlx

model:
  name: mlx-community/Qwen3.5-4B-MLX-4bit
  source_name: Qwen/Qwen3.5-4B
  revision: main
  max_length: 192

data:
  train_path: data/generated/qwen3.5-mlx/train.jsonl
  probe_path: data/generated/qwen3.5-mlx/probe.jsonl
  train_examples: 1200
  probe_train_examples: 512
  probe_id_examples: 256
  probe_transfer_examples: 256
  shortcut_strength: 0.95

train:
  output_dir: runs/qwen3.5-4b-mlx-50step/checkpoints
  max_steps: 50
  batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.0002
  optimizer: adamw
  logging_steps: 1
  save_steps: 10
  gradient_checkpointing: false
  num_layers: -1
  clear_cache_threshold: 0
  lora:
    rank: 16
    alpha: 32
    dropout: 0.05

capture:
  output_dir: runs/qwen3.5-4b-mlx-50step/activations
  layer_fractions: [0.25, 0.50, 0.75, 1.00]
  batch_size: 8

probe:
  output_dir: runs/qwen3.5-4b-mlx-50step/report
  c_grid: [0.001, 0.01, 0.1, 1.0]
  cv_folds: 5
  bootstrap_samples: 200
  permutation_repeats: 10
